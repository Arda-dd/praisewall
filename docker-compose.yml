services:
  praisewall:
    build: .
    image: praisewall
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_URL: ${APP_URL:-http://localhost:8080}
      # Generate one with: echo "base64:$(openssl rand -base64 32)"
      APP_KEY: ${APP_KEY:?Set APP_KEY in a .env file next to this one}
    volumes:
      - praisewall-storage:/var/www/html/storage

volumes:
  praisewall-storage:
