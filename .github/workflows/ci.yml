name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, fileinfo, gd
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: vendor/bin/pint --test
      - run: php artisan test

  widget:
    name: Widget and assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t praisewall .
      - name: Start the container and check it serves
        run: |
          docker run -d --name praisewall -p 8080:8080 \
            -e APP_KEY="base64:$(openssl rand -base64 32)" -e APP_URL=http://localhost:8080 praisewall
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/up > /dev/null && break; sleep 2; done
          curl -fsS http://localhost:8080/setup | grep -q "Create account"
          curl -fsS http://localhost:8080/widget.js | grep -q "Praisewall"
          curl -fsS -o /dev/null -w "%{http_code}" http://localhost:8080/login | grep -q 302
      - if: failure()
        run: docker logs praisewall
